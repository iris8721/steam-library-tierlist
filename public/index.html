<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Library Tier List</title>
<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1b2838;
            color: #c7d5e0;
            margin: 0;
            padding: 20px;
        }
        
        h1, h2 {
            text-align: center;
            color: #66c0f4;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .search-form {
            background-color: #2a475e;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .search-form input {
            padding: 10px;
            width: 300px;
            margin-right: 10px;
            background-color: #1b2838;
            border: 1px solid #66c0f4;
            color: #c7d5e0;
            border-radius: 3px;
        }
        
        .search-form input[type="number"] {
            padding: 10px;
            width: 120px;
            margin-right: 10px;
            background-color: #1b2838;
            border: 1px solid #66c0f4;
            color: #c7d5e0;
            border-radius: 3px;
        }
        
        .search-form button {
            padding: 10px 20px;
            background-color: #66c0f4;
            color: #1b2838;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .search-form button:hover {
            transform: scale(1.05);
        }
        
        .tier {
            display: flex;
            margin-bottom: 10px;
            min-height: 120px; /* Minimum height for tier rows */
            align-items: stretch; /* This ensures children stretch to fill the height */
        }
        
        .tier-label {
            width: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            margin-right: 10px;
            color: black;
            cursor: pointer;
            font-size: 36px;
            text-align: center;
            overflow: hidden;
            word-break: break-word;
            padding: 10px;
            box-sizing: border-box;
            border-radius: 5px; /* Add rounded corners */
            flex: 0 0 120px; /* Fixed width, don't grow or shrink */
            align-self: stretch; /* Make it stretch to fill parent height */
        }
        
        .tier-items {
            flex-grow: 1;
            background-color: rgba(42, 71, 94, 0.5);
            border-radius: 5px;
            padding: 10px;
            min-height: 120px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .game-pool {
            background-color: rgba(42, 71, 94, 0.3);
            border-radius: 5px;
            padding: 20px;
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .game-card {
            width: 120px;
            height: 120px;
            background-color: #2a475e;
            border-radius: 5px;
            overflow: hidden;
            cursor: grab;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .game-card:hover {
            transform: scale(1.05);
        }
        
        .game-image {
            width: 100%;
            height: 56px;
            object-fit: cover;
            pointer-events: none;
        }
        
        .game-card.clone-for-export .game-image {
            max-width: 100%;
            height: auto;
            object-position: center;
        }
        
        .game-name {
            padding: 5px;
            font-size: 12px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 15px;
            pointer-events: none;
        }
        
        .game-playtime {
            position: absolute;
            bottom: 5px;
            left: 5px;
            font-size: 11px;
            color: #8bc53f;
            background-color: rgba(0, 0, 0, 0.5);
            padding: 2px 4px;
            border-radius: 3px;
            pointer-events: none;
        }
        
        .game-card:hover .game-tooltip {
            display: block;
        }
        
        .game-tooltip {
            display: none;
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 100;
            max-width: 250px;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }
        
        .controls {
            margin: 20px 0;
            text-align: center;
        }
        
        .controls button {
            padding: 10px 15px;
            margin: 0 5px;
            background-color: #66c0f4;
            color: #1b2838;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .controls button:hover {
            transform: scale(1.05);
        }
        
        .status-message {
            background-color: #2a475e;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: center;
            display: none;
        }
        
        .status-message.error {
            background-color: rgba(255, 77, 77, 0.3);
        }
        
        .status-message.success {
            background-color: rgba(77, 255, 77, 0.3);
        }
        
        .error-message {
            color: #ff7f7f;
        }
        
        /* Loading spinner */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #66c0f4;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin: 0 auto;
            display: none;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Drag and drop styles */
        .game-card.dragging {
            opacity: 0.7;
        }
        
        .tier-items.drag-over {
            background-color: rgba(102, 192, 244, 0.2);
        }
        
        /* Edit tier modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: #2a475e;
            padding: 20px;
            border-radius: 5px;
            width: 300px;
        }
        
        .modal-title {
            color: #66c0f4;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 18px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 15px;
            text-align: center;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            text-align: center;
        }
        
        .form-group input {
            width: 80%;
            padding: 8px;
            background-color: #1b2838;
            border: 1px solid #66c0f4;
            color: white;
            border-radius: 3px;
            text-align: center;
            margin: 0 auto;
            display: block;
        }
        
        .color-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 10px;
            width: 90%;
            margin-left: auto;
            margin-right: auto;
        }
        
        .color-option {
            width: 100%;
            height: 30px;
            border-radius: 3px;
            cursor: pointer;
        }
        
        .color-option.selected {
            transform: scale(0.9);
            box-shadow: 0 0 0 2px white;
        }
        
        .modal-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        .modal-buttons button {
            padding: 8px 16px;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .modal-buttons button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Steam Library Tier List</h1>
        
        <div id="status-message" class="status-message"></div>
        
        <div class="search-form">
            <input type="text" id="steam-id-input" placeholder="Enter Steam Vanity URL or Steam ID">
            <input type="number" id="min-hours-input" min="0" step="1" placeholder="Min Hrs Played" title="Minimum hours played">
            <button id="search-button">Load Games</button>
            <div id="loader" class="loader"></div>
        </div>
        
        <div class="controls">
            <button id="add-tier-button">Add Tier</button>
            <button id="reset-button">Reset Tier List</button>
            <button id="save-button">Save as Image</button>
        </div>
        
        <div id="tier-list">
            <!-- S Tier -->
            <div class="tier">
                <div class="tier-label" style="background-color: #ff7f7f;">S</div>
                <div class="tier-items" data-tier="S"></div>
            </div>
            
            <!-- A Tier -->
            <div class="tier">
                <div class="tier-label" style="background-color: #ffbf7f;">A</div>
                <div class="tier-items" data-tier="A"></div>
            </div>
            
            <!-- B Tier -->
            <div class="tier">
                <div class="tier-label" style="background-color: #ffdf7f;">B</div>
                <div class="tier-items" data-tier="B"></div>
            </div>
            
            <!-- C Tier -->
            <div class="tier">
                <div class="tier-label" style="background-color: #bfff7f;">C</div>
                <div class="tier-items" data-tier="C"></div>
            </div>
        </div>
        
        <h2>Game Pool</h2>
        <div id="game-pool" class="game-pool"></div>
    </div>
    
    <!-- Edit Tier Modal -->
    <div id="edit-tier-modal" class="modal">
        <div class="modal-content">
            <div class="modal-title">Edit Tier</div>
            <div class="form-group">
                <label for="tier-name-input">Tier Name:</label>
                <input type="text" id="tier-name-input" maxlength="15">
            </div>
            <div class="form-group">
                <label>Tier Color:</label>
                <div id="color-options" class="color-options"></div>
            </div>
            <div class="modal-buttons">
                <button id="cancel-edit-btn">Cancel</button>
                <button id="save-tier-btn">Save</button>
            </div>
        </div>
    </div>
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</body>

<script>
    // Elements
    const steamIdInput = document.getElementById('steam-id-input');
    const minHoursInput = document.getElementById('min-hours-input');
    const searchButton = document.getElementById('search-button');
    const statusMessage = document.getElementById('status-message');
    const loader = document.getElementById('loader');
    const gamePool = document.getElementById('game-pool');
    const addTierButton = document.getElementById('add-tier-button');
    const resetButton = document.getElementById('reset-button');
    const saveButton = document.getElementById('save-button');
    const tierList = document.getElementById('tier-list');
    const editTierModal = document.getElementById('edit-tier-modal');
    const tierNameInput = document.getElementById('tier-name-input');
    const colorOptions = document.getElementById('color-options');
    const cancelEditBtn = document.getElementById('cancel-edit-btn');
    const saveTierBtn = document.getElementById('save-tier-btn');
    
    // Variables
    let currentEditingTier = null;
    let selectedColor = null;
    let allGames = []; // Store all games for filtering
    
    // Color palette for tiers
    const tierColors = [
        '#ff7f7f', '#ffbf7f', '#ffdf7f', '#ffff7f', 
        '#bfff7f', '#7fff7f', '#7fffbf', '#7fffff', 
        '#7fbfff', '#7f7fff', '#bf7fff', '#ff7fff',
        '#ff7fbf', '#ffffff', '#cccccc', '#999999'
    ];
    
    // Function to adjust tier label font size based on content - less aggressive scaling
    function adjustTierLabelFontSize(label) {
        const text = label.textContent;
        const baseSize = 36; // Increased default font size
        
        // More lenient scaling based on text length
        if (text.length <= 1) {
            label.style.fontSize = baseSize + 'px';
        } else if (text.length <= 3) {
            label.style.fontSize = (baseSize - 2) + 'px'; // Only reduce slightly
        } else if (text.length <= 5) {
            label.style.fontSize = (baseSize - 4) + 'px'; // More gradual reduction
        } else if (text.length <= 8) {
            label.style.fontSize = (baseSize - 8) + 'px'; 
        } else if (text.length <= 10) {
            label.style.fontSize = (baseSize - 12) + 'px';
        } else {
            label.style.fontSize = (baseSize - 16) + 'px'; // Still larger than before
        }
        
        // For longer texts, add line breaks if there isn't one already
        if (text.length > 6 && !text.includes('\n') && !text.includes('<br>')) {
            // Find a good place to break the text
            const midPoint = Math.floor(text.length / 2);
            let breakIndex = text.lastIndexOf(' ', midPoint);
            
            if (breakIndex === -1 || breakIndex < 2) {
                // If no space found, or space is too early, break at midpoint
                breakIndex = midPoint;
            }
            
            const firstPart = text.substring(0, breakIndex);
            const secondPart = text.substring(breakIndex);
            
            label.innerHTML = firstPart + '<br>' + secondPart.trim();
        }
    }
    
    // Event listeners
    document.addEventListener('DOMContentLoaded', function() {
        console.log('DOM fully loaded');
        
        // Apply font size adjustment to existing tier labels
        document.querySelectorAll('.tier-label').forEach(label => {
            adjustTierLabelFontSize(label);
        });
        
        // Set up event listeners for elements we know exist at page load
        searchButton.addEventListener('click', loadGames);
        addTierButton.addEventListener('click', addNewTier);
        resetButton.addEventListener('click', resetTierList);
        saveButton.addEventListener('click', saveTierListAsImage);
        
        // Modal elements
        cancelEditBtn.addEventListener('click', closeEditTierModal);
        saveTierBtn.addEventListener('click', saveTierEdit);
        
        // Set up tier label click handlers
        document.querySelectorAll('.tier-label').forEach(label => {
            label.addEventListener('click', openEditTierModal);
        });
        
        // Initialize color options
        initializeColorOptions();
        
        // Set up drag and drop
        setupDragAndDrop();
        
        // Check URL for steamID parameter
        const urlParams = new URLSearchParams(window.location.search);
        const steamId = urlParams.get('steamid');
        if (steamId) {
            steamIdInput.value = steamId;
            loadGames();
        }
        
        console.log('Event listeners successfully attached');
    });
    
    // Load games from Steam
    function loadGames() {
        const steamId = steamIdInput.value.trim();
        const minHours = parseInt(minHoursInput.value) || 0;
        
        if (!steamId) {
            showStatusMessage('Please enter a Steam ID or Vanity URL', 'error');
            return;
        }
        
        // Show loading indicator
        loader.style.display = 'block';
        showStatusMessage('Loading games...', 'normal');
        
        // Determine if input is a URL, vanity URL, or SteamID64
        let apiEndpoint = `/api/games?`;
        
        if (steamId.match(/^7656119\d{10}$/)) {
            // It's a SteamID64
            apiEndpoint += `steamid=${steamId}`;
        } else if (steamId.includes('steamcommunity.com')) {
            // It's a full URL
            if (steamId.includes('/id/')) {
                // Vanity URL
                const vanityName = steamId.split('/id/')[1].split('/')[0];
                apiEndpoint += `vanity=${vanityName}`;
            } else if (steamId.includes('/profiles/')) {
                // Profile URL with SteamID64
                const profileId = steamId.split('/profiles/')[1].split('/')[0];
                apiEndpoint += `steamid=${profileId}`;
            }
        } else {
            // Assume it's a vanity URL name
            apiEndpoint += `vanity=${steamId}`;
        }
        
        // Add timestamp to prevent caching
        apiEndpoint += `&t=${Date.now()}`;
        
        // Fetch games
        fetch(apiEndpoint)
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => {
                        throw new Error(err.message || 'Failed to load games');
                    });
                }
                return response.json();
            })
            .then(games => {
                if (!games || games.length === 0) {
                    throw new Error('No games found or profile is private');
                }
                
                // Store all games
                allGames = games;
                
                // Filter games by minimum hours
                const filteredGames = games.filter(game => game.playtime >= minHours);
                
                if (filteredGames.length === 0) {
                    showStatusMessage(`No games found with ${minHours}+ hours of playtime`, 'error');
                    loader.style.display = 'none';
                    return;
                }
                
                // Clear game pool
                gamePool.innerHTML = '';
                
                // Create game cards
                filteredGames.forEach(game => {
                    const gameCard = createGameCard(game);
                    gamePool.appendChild(gameCard);
                });
                
                showStatusMessage(`Loaded ${filteredGames.length} games with ${minHours}+ hours (${games.length} total)`, 'success');
            })
            .catch(error => {
                showStatusMessage(`Error: ${error.message}`, 'error');
            })
            .finally(() => {
                loader.style.display = 'none';
            });
    }
    
    // Create a game card element
    function createGameCard(game) {
        const gameCard = document.createElement('div');
        gameCard.className = 'game-card';
        gameCard.draggable = true;
        gameCard.dataset.appid = game.appid;
        gameCard.dataset.name = game.name;
        gameCard.dataset.playtime = game.playtime || 0;
        
        // Game tooltip for full name on hover
        const gameTooltip = document.createElement('div');
        gameTooltip.className = 'game-tooltip';
        gameTooltip.textContent = game.name;
        gameCard.appendChild(gameTooltip);
        
        // Game image
        const gameImage = document.createElement('img');
        gameImage.className = 'game-image';
        gameImage.src = `https://cdn.cloudflare.steamstatic.com/steam/apps/${game.appid}/header.jpg`;
        gameImage.alt = game.name;
        gameImage.crossOrigin = "anonymous"; // Allow cross-origin loading
        gameImage.onerror = function() {
            // Using data URI instead of placeholder.com which seems to be unreachable
            this.src = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20version%3D%221.1%22%20width%3D%22120%22%20height%3D%2256%22%3E%3Crect%20width%3D%22120%22%20height%3D%2256%22%20fill%3D%22%23424242%22%2F%3E%3Ctext%20x%3D%2260%22%20y%3D%2228%22%20font-family%3D%22Arial%22%20font-size%3D%2212%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%23ffffff%22%3ENo%20Image%3C%2Ftext%3E%3C%2Fsvg%3E';
        };
        gameCard.appendChild(gameImage);
        
        // Game name
        const gameName = document.createElement('div');
        gameName.className = 'game-name';
        gameName.title = game.name;
        gameName.textContent = game.name;
        gameCard.appendChild(gameName);
        
        // Game playtime
        const gamePlaytime = document.createElement('div');
        gamePlaytime.className = 'game-playtime';
        
        // Format the playtime
        let playtimeText;
        if (game.playtime === 0) {
            playtimeText = '0 hrs';
        } else if (game.playtime < 1) {
            playtimeText = '< 1 hr';
        } else {
            playtimeText = `${game.playtime} hrs`;
        }
        
        gamePlaytime.textContent = playtimeText;
        gameCard.appendChild(gamePlaytime);
        
        // Set up drag events
        gameCard.addEventListener('dragstart', handleDragStart);
        gameCard.addEventListener('dragend', handleDragEnd);
        
        return gameCard;
    }
    
    // Setup drag and drop
    function setupDragAndDrop() {
        // Set up drop zones
        const dropZones = document.querySelectorAll('.tier-items, #game-pool');
        dropZones.forEach(zone => {
            zone.addEventListener('dragover', handleDragOver);
            zone.addEventListener('dragenter', handleDragEnter);
            zone.addEventListener('dragleave', handleDragLeave);
            zone.addEventListener('drop', handleDrop);
        });
    }
    
    // Drag and drop handlers
    function handleDragStart(e) {
        this.classList.add('dragging');
        e.dataTransfer.setData('text/plain', this.dataset.appid);
        e.dataTransfer.effectAllowed = 'move';
        
        // Create a custom drag image that shows the whole card
        const dragImage = this.cloneNode(true);
        dragImage.style.opacity = '1';
        dragImage.style.position = 'absolute';
        dragImage.style.top = '-1000px';
        document.body.appendChild(dragImage);
        e.dataTransfer.setDragImage(dragImage, 60, 60); // Center point
        
        // Clean up the clone after drag starts
        setTimeout(() => {
            document.body.removeChild(dragImage);
        }, 0);
    }
    
    function handleDragEnd() {
        this.classList.remove('dragging');
        document.querySelectorAll('.tier-items').forEach(item => {
            item.classList.remove('drag-over');
        });
    }
    
    function handleDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        
        // For reordering within a tier
        const draggable = document.querySelector('.dragging');
        if (draggable && this.contains(draggable)) {
            const afterElement = getDragAfterElement(this, e.clientX, e.clientY);
            if (afterElement) {
                this.insertBefore(draggable, afterElement);
            } else {
                this.appendChild(draggable);
            }
        }
        
        return false;
    }
    
    // Function to determine position for reordering
    function getDragAfterElement(container, x, y) {
        // Get all non-dragging game cards in the container
        const draggableElements = [...container.querySelectorAll('.game-card:not(.dragging)')];
        
        // Find the closest element based on mouse position
        return draggableElements.reduce((closest, child) => {
            // Get bounding rectangle for the element
            const box = child.getBoundingClientRect();
            
            // Calculate offset from the center (for horizontal sorting)
            const horizontalOffset = x - (box.left + box.width / 2);
            const verticalOffset = y - (box.top + box.height / 2);
            
            // Calculate distance from the mouse to the center of the element
            const distance = Math.sqrt(horizontalOffset * horizontalOffset + verticalOffset * verticalOffset);
            
            // Only consider elements that are "ahead" of the mouse
            if (horizontalOffset > 0) return closest;
            
            // If this element is closer than the current closest, update closest
            if (distance < closest.distance) {
                return { element: child, distance: distance };
            } else {
                return closest;
            }
        }, { element: null, distance: Number.POSITIVE_INFINITY }).element;
    }
    
    function handleDragEnter(e) {
        this.classList.add('drag-over');
    }
    
    function handleDragLeave(e) {
        this.classList.remove('drag-over');
    }
    
    function handleDrop(e) {
        e.preventDefault();
        this.classList.remove('drag-over');
        
        const appId = e.dataTransfer.getData('text/plain');
        const draggedItem = document.querySelector(`.game-card[data-appid="${appId}"]`);
        
        if (draggedItem && !this.contains(draggedItem)) {
            // Get the element after which to insert the dragged item
            const afterElement = getDragAfterElement(this, e.clientX, e.clientY);
            
            if (afterElement) {
                this.insertBefore(draggedItem, afterElement);
            } else {
                this.appendChild(draggedItem);
            }
        }
        
        return false;
    }
    
    // Initialize color options
    function initializeColorOptions() {
        console.log('Initializing color options');
        
        colorOptions.innerHTML = '';
        
        tierColors.forEach(color => {
            const colorOption = document.createElement('div');
            colorOption.className = 'color-option';
            colorOption.style.backgroundColor = color;
            colorOption.addEventListener('click', function() {
                console.log('Color option clicked:', color);
                // Remove selected class from all options
                document.querySelectorAll('.color-option').forEach(option => {
                    option.classList.remove('selected');
                });
                
                // Add selected class to clicked option
                colorOption.classList.add('selected');
                selectedColor = color;
            });
            colorOptions.appendChild(colorOption);
        });
        
        console.log('Color options initialized successfully');
    }
    
    // Open edit tier modal
    function openEditTierModal() {
        console.log('Tier label clicked - opening edit modal');
        currentEditingTier = this;
        
        // Get current values
        const tierName = this.textContent;
        const tierColor = this.style.backgroundColor;
        
        console.log('Current tier values:', tierName, tierColor);
        
        // Set form values
        tierNameInput.value = tierName;
        
        // Show modal
        editTierModal.style.display = 'flex';
        
        // Find and select the current color
        document.querySelectorAll('.color-option').forEach(option => {
            option.classList.remove('selected');
            
            if (option.style.backgroundColor === tierColor) {
                option.classList.add('selected');
                selectedColor = tierColor;
            }
        });
    }
    
    // Close edit tier modal
    function closeEditTierModal() {
        editTierModal.style.display = 'none';
    }
    
    // Save tier edit
    function saveTierEdit() {
        if (!currentEditingTier) return;
        
        // Update tier name
        const newName = tierNameInput.value.trim() || currentEditingTier.textContent;
        currentEditingTier.textContent = newName;
        
        // Adjust font size based on new name
        adjustTierLabelFontSize(currentEditingTier);
        
        // Update tier color if selected
        if (selectedColor) {
            currentEditingTier.style.backgroundColor = selectedColor;
            
            // Update text color based on background brightness
// Update text color based on background brightness
const rgb = hexToRgb(selectedColor);
            if (rgb) {
                const brightness = (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
                currentEditingTier.style.color = brightness > 125 ? '#000' : '#fff';
            }
        }
        
        // Close modal
        closeEditTierModal();
    }
    
    // Add a new tier
    function addNewTier() {
        const tiers = ['D', 'E', 'F', 'G', 'H'];
        const colors = ['#7fff7f', '#7fffbf', '#7fbfff', '#bf7fff', '#ff7fbf'];
        
        const existingTiers = tierList.querySelectorAll('.tier').length;
        if (existingTiers >= 9) {
            showStatusMessage('Maximum number of tiers reached!', 'error');
            return;
        }
        
        const newTierIndex = existingTiers - 4; // We already have S, A, B, C
        if (newTierIndex >= 0 && newTierIndex < tiers.length) {
            const tier = document.createElement('div');
            tier.className = 'tier';
            
            const tierLabel = document.createElement('div');
            tierLabel.className = 'tier-label';
            tierLabel.textContent = tiers[newTierIndex];
            tierLabel.style.backgroundColor = colors[newTierIndex];
            
            // Add click handler for editing
            tierLabel.addEventListener('click', openEditTierModal);
            
            // Adjust font size for the new tier
            adjustTierLabelFontSize(tierLabel);
            
            const tierItems = document.createElement('div');
            tierItems.className = 'tier-items';
            tierItems.dataset.tier = tiers[newTierIndex];
            
            // Set up drop zone
            tierItems.addEventListener('dragover', handleDragOver);
            tierItems.addEventListener('dragenter', handleDragEnter);
            tierItems.addEventListener('dragleave', handleDragLeave);
            tierItems.addEventListener('drop', handleDrop);
            
            tier.appendChild(tierLabel);
            tier.appendChild(tierItems);
            tierList.appendChild(tier);
            
            showStatusMessage(`Added tier ${tiers[newTierIndex]}`, 'success');
        }
    }
    
    // Reset tier list
    function resetTierList() {
        if (confirm('Are you sure you want to reset the tier list? All games will be moved back to the game pool.')) {
            const allGames = document.querySelectorAll('.tier-items .game-card');
            allGames.forEach(game => {
                gamePool.appendChild(game);
            });
            showStatusMessage('Tier list has been reset', 'success');
        }
    }
    
    // Save tier list as image
    function saveTierListAsImage() {
        // Create a container with all tiers (including empty ones)
        const tempContainer = document.createElement('div');
        tempContainer.style.backgroundColor = '#1b2838';
        tempContainer.style.padding = '20px';
        
        const title = document.createElement('h1');
        title.textContent = 'Steam Library Tier List';
        title.style.color = '#66c0f4';
        title.style.textAlign = 'center';
        tempContainer.appendChild(title);
        
        // Clone the tier list including all tiers
        const tierListClone = document.createElement('div');
        
        // Pre-load all images to cache them
        const gameImages = document.querySelectorAll('.game-image');
        const imagePromises = [];
        
        gameImages.forEach(img => {
            const promise = new Promise((resolve) => {
                // If image is already loaded, resolve immediately
                if (img.complete) {
                    resolve();
                    return;
                }
                
                // Create a new image element to pre-load the same source
                const preloadImg = new Image();
                preloadImg.crossOrigin = "anonymous";
                preloadImg.onload = () => resolve();
                preloadImg.onerror = () => resolve(); // Resolve on error too
                preloadImg.src = img.src;
            });
            
            imagePromises.push(promise);
        });
        
        // Show a loading message
        showStatusMessage('Preparing image...', 'normal');
        
        // Wait for all images to load
        Promise.all(imagePromises)
            .then(() => {
                // Clone all tiers regardless of whether they contain games
                document.querySelectorAll('.tier').forEach(tier => {
                    const tierClone = tier.cloneNode(true);
                    
                    // Apply export-specific styles to the clone
                    tierClone.querySelectorAll('.game-card').forEach(card => {
                        card.classList.add('clone-for-export');
                        // Ensure image is visible in the clone
                        const img = card.querySelector('.game-image');
                        if (img) {
                            // If the original image didn't load, use the fallback
                            if (img.naturalWidth === 0) {
                                img.src = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20version%3D%221.1%22%20width%3D%22120%22%20height%3D%2256%22%3E%3Crect%20width%3D%22120%22%20height%3D%2256%22%20fill%3D%22%23424242%22%2F%3E%3Ctext%20x%3D%2260%22%20y%3D%2228%22%20font-family%3D%22Arial%22%20font-size%3D%2212%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%23ffffff%22%3ENo%20Image%3C%2Ftext%3E%3C%2Fsvg%3E';
                            }
                        }
                    });
                    
                    tierListClone.appendChild(tierClone);
                });
                
                tempContainer.appendChild(tierListClone);
                
                // Temporarily append to body but hide it
                tempContainer.style.position = 'absolute';
                tempContainer.style.left = '-9999px';
                document.body.appendChild(tempContainer);
                
                // Use html2canvas with proper settings
                return html2canvas(tempContainer, {
                    backgroundColor: '#1b2838',
                    scale: 2,
                    logging: true,
                    useCORS: true, // Important for loading images from external domains
                    allowTaint: true // Allow using images from other domains
                });
            })
            .then(canvas => {
                // Create download link
                const link = document.createElement('a');
                link.download = 'steam-tier-list.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // Clean up
                document.body.removeChild(tempContainer);
                showStatusMessage('Tier list image saved!', 'success');
            })
            .catch(error => {
                console.error('Error generating image:', error);
                showStatusMessage('Failed to generate image: ' + error.message, 'error');
                if (document.body.contains(tempContainer)) {
                    document.body.removeChild(tempContainer);
                }
            });
    }
    
    // Helper to convert RGB to HEX
    function rgbToHex(rgb) {
        // Default if empty
        if (!rgb) return '#000000';
        
        // Handle rgb(r, g, b) format
        const rgbMatch = rgb.match(/^rgb\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
        if (rgbMatch) {
            return '#' + 
                ('0' + parseInt(rgbMatch[1], 10).toString(16)).slice(-2) +
                ('0' + parseInt(rgbMatch[2], 10).toString(16)).slice(-2) +
                ('0' + parseInt(rgbMatch[3], 10).toString(16)).slice(-2);
        }
        
        // If already hex or other format, return as is
        return rgb;
    }
    
    // Helper to convert HEX to RGB
    function hexToRgb(hex) {
        // If not a string, return null
        if (typeof hex !== 'string') return null;
        
        // Remove # if present
        hex = hex.replace(/^#/, '');
        
        // Parse hex to RGB
        const bigint = parseInt(hex, 16);
        if (isNaN(bigint)) return null;
        
        return {
            r: (bigint >> 16) & 255,
            g: (bigint >> 8) & 255,
            b: bigint & 255
        };
    }
    
    // Show status message
    function showStatusMessage(message, type) {
        statusMessage.textContent = message;
        statusMessage.style.display = 'block';
        
        // Reset classes
        statusMessage.classList.remove('error', 'success');
        
        if (type === 'error') {
            statusMessage.classList.add('error');
        } else if (type === 'success') {
            statusMessage.classList.add('success');
        }
        
        // Auto hide after 5 seconds
        setTimeout(() => {
            statusMessage.style.display = 'none';
        }, 5000);
    }
