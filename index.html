<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Steam Library Tier List</title>
		<style>
			:root {
				--bg-color: #1b2838;
				--text-color: #c7d5e0;
				--accent-color: #66c0f4;
				--container-bg: #2a475e;
				--container-bg-alt: rgba(42, 71, 94, 0.5);
				--container-bg-lite: rgba(42, 71, 94, 0.3);
				--hover-bg: rgba(102, 192, 244, 0.2);
				--success-bg: rgba(77, 255, 77, 0.3);
				--error-bg: rgba(255, 77, 77, 0.3);
				--btn-hover-scale: 1.05;
				--achievement-color: #66c0f4;
				--playtime-color: #8bc53f;
				--font-family: Arial, sans-serif;
			}

			body {
				font-family: var(--font-family);
				background-color: var(--bg-color);
				color: var(--text-color);
				margin: 0;
				padding: 20px;
			}

			h1,
			h2 {
				text-align: center;
				color: var(--accent-color);
			}

			.container {
				max-width: 1200px;
				margin: 0 auto;
			}

			.search-form {
				background-color: var(--container-bg);
				padding: 20px;
				border-radius: 5px;
				margin-bottom: 20px;
				text-align: center;
			}

			.search-form input {
				padding: 10px;
				width: 300px;
				margin-right: 10px;
				background-color: var(--bg-color);
				border: 1px solid var(--accent-color);
				color: var(--text-color);
				border-radius: 3px;
			}

			.search-form input[type='number'] {
				padding: 10px;
				width: 120px;
				margin-right: 10px;
				background-color: var(--bg-color);
				border: 1px solid var(--accent-color);
				color: var(--text-color);
				border-radius: 3px;
			}

			.search-form button {
				padding: 10px 20px;
				background-color: var(--accent-color);
				color: var(--bg-color);
				border: none;
				border-radius: 3px;
				cursor: pointer;
				transition: transform 0.2s, background-color 0.2s;
			}

			.search-form button:hover {
				transform: scale(var(--btn-hover-scale));
			}

			.tier {
				display: flex;
				margin-bottom: 10px;
				min-height: 120px;
				align-items: stretch;
				position: relative;
			}

			.tier-actions {
				display: flex;
				flex-direction: column;
				margin-right: 10px;
			}

			.tier-action-btn {
				background-color: var(--container-bg);
				color: var(--text-color);
				border: none;
				border-radius: 3px;
				width: 30px;
				height: 30px;
				margin-bottom: 5px;
				cursor: pointer;
				display: flex;
				justify-content: center;
				align-items: center;
				font-size: 18px;
				transition: background-color 0.2s;
			}

			.tier-action-btn:hover {
				background-color: #3d6c8d;
			}

			.tier-action-btn.delete {
				background-color: #8b3a3a;
			}

			.tier-action-btn.delete:hover {
				background-color: #b54b4b;
			}

			.tier-label {
				width: 120px;
				display: flex;
				justify-content: center;
				align-items: center;
				font-weight: bold;
				margin-right: 10px;
				color: black;
				cursor: pointer;
				font-size: 36px;
				text-align: center;
				overflow: hidden;
				word-break: break-word;
				padding: 10px;
				box-sizing: border-box;
				border-radius: 5px;
				flex: 0 0 120px;
				align-self: stretch;
			}

			.tier-items {
				flex-grow: 1;
				background-color: var(--container-bg-alt);
				border-radius: 5px;
				padding: 10px;
				min-height: 120px;
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
			}

			.game-pool {
				background-color: var(--container-bg-lite);
				border-radius: 5px;
				padding: 20px;
				margin-top: 20px;
				display: flex;
				flex-wrap: wrap;
				gap: 10px;
			}

			.game-card {
				width: 120px;
				height: 120px;
				background-color: var(--container-bg);
				border-radius: 5px;
				overflow: hidden;
				cursor: grab;
				display: flex;
				flex-direction: column;
				position: relative;
				transform-style: preserve-3d;
				perspective: 500px;
				will-change: transform;
				backface-visibility: hidden;
				-webkit-backface-visibility: hidden;
				-webkit-transform-style: preserve-3d;
			}

			.game-card .tilt-effect {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				bottom: 0;
				pointer-events: none;
				border-radius: 5px;
				transform-style: preserve-3d;
				-webkit-transform-style: preserve-3d;
				transform: translateZ(0);
				-webkit-transform: translateZ(0);
			}

			.game-image {
				width: 100%;
				height: 56px;
				object-fit: cover;
				pointer-events: none;
				backface-visibility: hidden;
				-webkit-backface-visibility: hidden;
				transform: translateZ(0);
				-webkit-transform: translateZ(0);
			}

			.game-card.clone-for-export .game-image {
				max-width: 100%;
				height: auto;
				object-position: center;
			}

			.game-name {
				padding: 5px;
				font-size: 12px;
				text-align: center;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				margin-bottom: 15px;
				pointer-events: none;
				backface-visibility: hidden;
				-webkit-backface-visibility: hidden;
				transform: translateZ(0);
				-webkit-transform: translateZ(0);
			}

			.game-playtime {
				position: absolute;
				bottom: 5px;
				left: 5px;
				font-size: 11px;
				color: var(--playtime-color);
				background-color: rgba(0, 0, 0, 0.5);
				padding: 2px 4px;
				border-radius: 3px;
				pointer-events: none;
				backface-visibility: hidden;
				-webkit-backface-visibility: hidden;
				transform: translateZ(0);
				-webkit-transform: translateZ(0);
			}

			.game-card:hover .game-tooltip {
				display: block;
			}

			.game-tooltip {
				display: none;
				position: absolute;
				top: -40px;
				left: 50%;
				transform: translateX(-50%);
				background-color: rgba(0, 0, 0, 0.8);
				color: white;
				padding: 5px 10px;
				border-radius: 5px;
				font-size: 12px;
				white-space: nowrap;
				z-index: 100;
				max-width: 250px;
				overflow: hidden;
				text-overflow: ellipsis;
				pointer-events: none;
			}

			.controls {
				margin: 20px 0;
				text-align: center;
			}

			.controls button {
				padding: 10px 15px;
				margin: 0 5px;
				background-color: var(--accent-color);
				color: var(--bg-color);
				border: none;
				border-radius: 5px;
				cursor: pointer;
				transition: transform 0.2s, background-color 0.2s;
			}

			.controls button:hover {
				transform: scale(var(--btn-hover-scale));
			}

			.status-message {
				background-color: var(--container-bg);
				padding: 10px;
				border-radius: 5px;
				margin-bottom: 10px;
				text-align: center;
				display: none;
			}

			.status-message.error {
				background-color: var(--error-bg);
			}

			.status-message.success {
				background-color: var(--success-bg);
			}

			.error-message {
				color: #ff7f7f;
			}

			.loader {
				border: 5px solid #f3f3f3;
				border-top: 5px solid var(--accent-color);
				border-radius: 50%;
				width: 30px;
				height: 30px;
				animation: spin 2s linear infinite;
				margin: 0 auto;
				display: none;
			}

			@keyframes spin {
				0% {
					transform: rotate(0deg);
				}
				100% {
					transform: rotate(360deg);
				}
			}

			.game-card.dragging {
				opacity: 0.7;
			}

			.tier-items.drag-over {
				background-color: var(--hover-bg);
			}

			.modal {
				display: none;
				position: fixed;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				background-color: rgba(0, 0, 0, 0.7);
				z-index: 1000;
				justify-content: center;
				align-items: center;
			}

			.modal-content {
				background-color: var(--container-bg);
				padding: 20px;
				border-radius: 5px;
				width: 350px;
			}

			.modal-title {
				color: var(--accent-color);
				margin-top: 0;
				margin-bottom: 15px;
				font-size: 18px;
				text-align: center;
			}

			.form-group {
				margin-bottom: 15px;
				text-align: center;
			}

			.form-group label {
				display: block;
				margin-bottom: 5px;
				text-align: center;
			}

			.form-group input {
				width: 80%;
				padding: 8px;
				background-color: var(--bg-color);
				border: 1px solid var(--accent-color);
				color: white;
				border-radius: 3px;
				text-align: center;
				margin: 0 auto;
				display: block;
			}

			.color-picker-container {
				display: flex;
				flex-direction: column;
				align-items: center;
				margin-top: 10px;
			}

			.rgb-inputs {
				display: flex;
				gap: 10px;
				margin-bottom: 10px;
				justify-content: center;
			}

			.rgb-input {
				display: flex;
				flex-direction: column;
				align-items: center;
			}

			.rgb-input label {
				margin-bottom: 5px;
				font-size: 14px;
			}

			.rgb-input input {
				width: 60px;
				text-align: center;
				padding: 5px;
				background-color: var(--bg-color);
				border: 1px solid var(--accent-color);
				color: white;
				border-radius: 3px;
			}

			.color-preview {
				width: 100px;
				height: 50px;
				margin-top: 10px;
				border-radius: 5px;
				border: 2px solid var(--accent-color);
			}

			.preset-colors {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 8px;
				margin-top: 15px;
				width: 90%;
				margin-left: auto;
				margin-right: auto;
			}

			.preset-color {
				width: 100%;
				height: 30px;
				border-radius: 3px;
				cursor: pointer;
				transition: transform 0.2s;
			}

			.preset-color:hover {
				transform: scale(1.1);
			}

			.modal-buttons {
				display: flex;
				justify-content: center;
				gap: 20px;
				margin-top: 20px;
			}

			.modal-buttons button {
				padding: 8px 16px;
				transition: transform 0.2s, background-color 0.2s;
				background-color: var(--accent-color);
				color: var(--bg-color);
				border: none;
				border-radius: 3px;
				cursor: pointer;
			}

			.modal-buttons button:hover {
				transform: scale(var(--btn-hover-scale));
			}

			/* Custom Game Modal Styles */
			#image-preview-container {
				text-align: center;
				margin-top: 10px;
				margin-bottom: 10px;
				padding: 5px;
				background: rgba(0, 0, 0, 0.2);
				border-radius: 5px;
			}

			#custom-game-image {
				background-color: var(--bg-color);
				border: 1px solid var(--accent-color);
				color: var(--text-color);
				border-radius: 3px;
				width: 100%;
				padding: 8px;
				box-sizing: border-box;
			}

			.steam-store-link {
				position: absolute;
				top: 5px;
				right: 5px;
				width: 20px;
				height: 20px;
				background-color: rgba(0, 0, 0, 0.6);
				border-radius: 3px;
				display: flex;
				justify-content: center;
				align-items: center;
				cursor: pointer;
				opacity: 0;
				transition: opacity 0.2s;
				z-index: 10;
				backface-visibility: hidden;
				-webkit-backface-visibility: hidden;
				transform: translateZ(0);
				-webkit-transform: translateZ(0);
			}

			.steam-store-link svg {
				width: 14px;
				height: 14px;
				fill: var(--accent-color);
			}

			.game-card:hover .steam-store-link {
				opacity: 1;
			}

			/* Achievements display */
			.game-achievements {
				position: absolute;
				bottom: 5px;
				right: 5px;
				font-size: 11px;
				color: var(--achievement-color);
				background-color: rgba(0, 0, 0, 0.5);
				padding: 2px 4px;
				border-radius: 3px;
				pointer-events: none;
			}

			/* Theme customization section */
			.theme-section {
				background-color: var(--container-bg);
				border-radius: 5px;
				padding: 15px;
				margin: 20px 0;
			}

			.theme-section h3 {
				margin-top: 0;
				text-align: center;
				color: var(--accent-color);
			}

			.theme-controls {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
				gap: 15px;
			}

			.theme-control {
				display: flex;
				flex-direction: column;
				align-items: center;
			}

			.theme-control label {
				margin-bottom: 5px;
				font-size: 14px;
			}

			.theme-control input[type='color'] {
				width: 80px;
				height: 30px;
				background-color: var(--bg-color);
				border: 1px solid var(--accent-color);
				border-radius: 3px;
			}

			.preset-themes {
				display: flex;
				justify-content: center;
				gap: 10px;
				margin-top: 15px;
			}

			.preset-theme {
				padding: 5px 10px;
				border-radius: 3px;
				cursor: pointer;
				transition: transform 0.2s;
				background-color: var(--bg-color);
				border: 1px solid var(--accent-color);
			}

			.preset-theme:hover {
				transform: scale(1.05);
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>Steam Library Tier List</h1>

			<div id="status-message" class="status-message"></div>

			<div class="search-form">
				<input type="text" id="steam-id-input" placeholder="Enter Steam Vanity URL or Steam ID" />
				<input type="number" id="min-hours-input" min="0" step="1" placeholder="Min Hrs Played" title="Minimum hours played" />
				<button id="search-button">Load Games</button>
				<div id="loader" class="loader"></div>
			</div>

			<div class="theme-section">
				<h3>Customize Theme</h3>
				<div class="theme-controls">
					<div class="theme-control">
						<label for="bg-color-input">Background Color</label>
						<input type="color" id="bg-color-input" value="#1b2838" />
					</div>
					<div class="theme-control">
						<label for="text-color-input">Text Color</label>
						<input type="color" id="text-color-input" value="#c7d5e0" />
					</div>
					<div class="theme-control">
						<label for="accent-color-input">Accent Color</label>
						<input type="color" id="accent-color-input" value="#66c0f4" />
					</div>
					<div class="theme-control">
						<label for="container-bg-input">Container Color</label>
						<input type="color" id="container-bg-input" value="#2a475e" />
					</div>
				</div>
				<div class="preset-themes">
					<button class="preset-theme" data-theme="steam">Steam (Default)</button>
					<button class="preset-theme" data-theme="dark">Dark Mode</button>
					<button class="preset-theme" data-theme="light">Light Mode</button>
					<button class="preset-theme" data-theme="retro">Retro Gaming</button>
					<button class="preset-theme" data-theme="cyberpunk">Cyberpunk</button>
				</div>
			</div>

			<div class="controls">
				<button id="add-tier-button">Add Tier</button>
				<button id="add-custom-game-button">Add Custom Game</button>
				<button id="reset-button">Reset Tier List</button>
				<button id="save-button">Save as Image</button>
			</div>

			<div id="tier-list">
				<!-- S Tier -->
				<div class="tier">
					<div class="tier-actions">
						<button class="tier-action-btn move-up" title="Move Up">↑</button>
						<button class="tier-action-btn move-down" title="Move Down">↓</button>
						<button class="tier-action-btn delete" title="Delete Tier">×</button>
					</div>
					<div class="tier-label" style="background-color: #ff7f7f">S</div>
					<div class="tier-items" data-tier="S"></div>
				</div>

				<!-- A Tier -->
				<div class="tier">
					<div class="tier-actions">
						<button class="tier-action-btn move-up" title="Move Up">↑</button>
						<button class="tier-action-btn move-down" title="Move Down">↓</button>
						<button class="tier-action-btn delete" title="Delete Tier">×</button>
					</div>
					<div class="tier-label" style="background-color: #ffbf7f">A</div>
					<div class="tier-items" data-tier="A"></div>
				</div>

				<!-- B Tier -->
				<div class="tier">
					<div class="tier-actions">
						<button class="tier-action-btn move-up" title="Move Up">↑</button>
						<button class="tier-action-btn move-down" title="Move Down">↓</button>
						<button class="tier-action-btn delete" title="Delete Tier">×</button>
					</div>
					<div class="tier-label" style="background-color: #ffdf7f">B</div>
					<div class="tier-items" data-tier="B"></div>
				</div>

				<!-- C Tier -->
				<div class="tier">
					<div class="tier-actions">
						<button class="tier-action-btn move-up" title="Move Up">↑</button>
						<button class="tier-action-btn move-down" title="Move Down">↓</button>
						<button class="tier-action-btn delete" title="Delete Tier">×</button>
					</div>
					<div class="tier-label" style="background-color: #bfff7f">C</div>
					<div class="tier-items" data-tier="C"></div>
				</div>
			</div>

			<h2>Game Pool</h2>
			<div id="game-pool" class="game-pool"></div>
		</div>

		<!-- Edit Tier Modal -->
		<div id="edit-tier-modal" class="modal">
			<div class="modal-content">
				<div class="modal-title">Edit Tier</div>

				<div class="form-group">
					<label for="tier-name-input">Tier Name:</label>
					<input type="text" id="tier-name-input" maxlength="15" />
				</div>

				<div class="form-group">
					<label>Tier Color:</label>

					<div class="color-picker-container">
						<div class="rgb-inputs">
							<div class="rgb-input">
								<label>R</label>
								<input type="number" id="red-input" min="0" max="255" value="255" />
							</div>
							<div class="rgb-input">
								<label>G</label>
								<input type="number" id="green-input" min="0" max="255" value="127" />
							</div>
							<div class="rgb-input">
								<label>B</label>
								<input type="number" id="blue-input" min="0" max="255" value="127" />
							</div>
						</div>

						<div id="color-preview" class="color-preview"></div>

						<label style="margin-top: 15px">Preset Colors:</label>
						<div id="preset-colors" class="preset-colors"></div>
					</div>
				</div>

				<div class="modal-buttons">
					<button id="cancel-edit-btn">Cancel</button>
					<button id="save-tier-btn">Save</button>
				</div>
			</div>
		</div>

		<!-- Custom Game Modal -->
		<div id="custom-game-modal" class="modal">
			<div class="modal-content">
				<div class="modal-title">Add Custom Game</div>

				<div class="form-group">
					<label for="custom-game-title">Game Title (Required):</label>
					<input type="text" id="custom-game-title" required />
				</div>

				<div class="form-group">
					<label for="custom-game-image">Game Image:</label>
					<input type="file" id="custom-game-image" accept="image/*" />
					<div id="image-preview-container" style="margin-top: 10px; display: none">
						<img id="image-preview" style="max-width: 100%; max-height: 150px; border-radius: 5px" />
					</div>
				</div>

				<div class="form-group">
					<label for="custom-game-hours">Hours Played (Optional):</label>
					<input type="number" id="custom-game-hours" min="0" step="0.1" placeholder="e.g. 42.5" />
				</div>

				<div class="modal-buttons">
					<button id="cancel-custom-game-btn">Cancel</button>
					<button id="add-custom-game-btn">Add Game</button>
				</div>
			</div>
		</div>

		<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
	</body>

	<script>
		// Elements
		const steamIdInput = document.getElementById('steam-id-input');
		const minHoursInput = document.getElementById('min-hours-input');
		const searchButton = document.getElementById('search-button');
		const statusMessage = document.getElementById('status-message');
		const loader = document.getElementById('loader');
		const gamePool = document.getElementById('game-pool');
		const addTierButton = document.getElementById('add-tier-button');
		const resetButton = document.getElementById('reset-button');
		const saveButton = document.getElementById('save-button');
		const tierList = document.getElementById('tier-list');
		const editTierModal = document.getElementById('edit-tier-modal');
		const tierNameInput = document.getElementById('tier-name-input');
		const redInput = document.getElementById('red-input');
		const greenInput = document.getElementById('green-input');
		const blueInput = document.getElementById('blue-input');

		// Function to adjust tier label font size based on content
		function adjustTierLabelFontSize(label) {
			const text = label.textContent;
			const baseSize = 36;

			if (text.length <= 1) {
				label.style.fontSize = baseSize + 'px';
			} else if (text.length <= 3) {
				label.style.fontSize = baseSize - 2 + 'px';
			} else if (text.length <= 5) {
				label.style.fontSize = baseSize - 4 + 'px';
			} else if (text.length <= 8) {
				label.style.fontSize = baseSize - 8 + 'px';
			} else if (text.length <= 10) {
				label.style.fontSize = baseSize - 12 + 'px';
			} else {
				label.style.fontSize = baseSize - 16 + 'px';
			}

			// For longer texts, add line breaks if there isn't one already
			if (text.length > 6 && !text.includes('\n') && !text.includes('<br>')) {
				const midPoint = Math.floor(text.length / 2);
				let breakIndex = text.lastIndexOf(' ', midPoint);

				if (breakIndex === -1 || breakIndex < 2) {
					breakIndex = midPoint;
				}

				const firstPart = text.substring(0, breakIndex);
				const secondPart = text.substring(breakIndex);

				label.innerHTML = firstPart + '<br>' + secondPart.trim();
			}
		}

		// RGB to Hex conversion
		function rgbToHex(r, g, b) {
			if (typeof r === 'object') {
				g = r.g;
				b = r.b;
				r = r.r;
			}

			return (
				'#' + ('0' + Math.round(r).toString(16)).slice(-2) + ('0' + Math.round(g).toString(16)).slice(-2) + ('0' + Math.round(b).toString(16)).slice(-2)
			);
		}

		// Hex to RGB conversion
		function hexToRgb(hex) {
			// Handle rgb format
			if (hex && hex.startsWith('rgb')) {
				const match = hex.match(/^rgb\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/i);
				if (match) {
					return {
						r: parseInt(match[1]),
						g: parseInt(match[2]),
						b: parseInt(match[3]),
					};
				}
				return null;
			}

			// Handle hex format
			if (!hex) return null;

			hex = hex.replace(/^#/, '');

			let r, g, b;
			if (hex.length === 3) {
				r = parseInt(hex.charAt(0) + hex.charAt(0), 16);
				g = parseInt(hex.charAt(1) + hex.charAt(1), 16);
				b = parseInt(hex.charAt(2) + hex.charAt(2), 16);
			} else {
				r = parseInt(hex.substring(0, 2), 16);
				g = parseInt(hex.substring(2, 4), 16);
				b = parseInt(hex.substring(4, 6), 16);
			}

			return isNaN(r) || isNaN(g) || isNaN(b) ? null : { r, g, b };
		}

		// Modified loadGames function - removed achievements functionality
		function loadGames() {
			const steamId = steamIdInput.value.trim();
			const minHours = parseInt(minHoursInput.value) || 0;

			if (!steamId) {
				showStatusMessage('Please enter a Steam ID or Vanity URL', 'error');
				return;
			}

			// Show loading indicator
			loader.style.display = 'block';
			showStatusMessage('Loading games...', 'normal');

			// Determine if input is a URL, vanity URL, or SteamID64
			let apiEndpoint = `/api/games?`;

			if (steamId.match(/^7656119\d{10}$/)) {
				// It's a SteamID64
				apiEndpoint += `steamid=${steamId}`;
				console.log('Using Steam ID:', steamId);
			} else if (steamId.includes('steamcommunity.com')) {
				// It's a full URL
				if (steamId.includes('/id/')) {
					// Vanity URL
					let vanityName = steamId.split('/id/')[1];
					// Remove trailing slashes and anything after them
					vanityName = vanityName.split('/')[0];
					// Remove any query parameters
					vanityName = vanityName.split('?')[0];
					apiEndpoint += `vanity=${vanityName}`;
					console.log('Using vanity from URL:', vanityName);
				} else if (steamId.includes('/profiles/')) {
					// Profile URL with SteamID64
					let profileId = steamId.split('/profiles/')[1];
					// Remove trailing slashes and anything after them
					profileId = profileId.split('/')[0];
					// Remove any query parameters
					profileId = profileId.split('?')[0];
					apiEndpoint += `steamid=${profileId}`;
					console.log('Using Steam ID from profile URL:', profileId);
				} else {
					// Unknown Steam URL format
					showStatusMessage('Invalid Steam URL format', 'error');
					loader.style.display = 'none';
					return;
				}
			} else {
				// Assume it's a vanity name
				apiEndpoint += `vanity=${steamId}`;
				console.log('Using vanity directly:', steamId);
			}

			// Add timestamp to prevent caching
			apiEndpoint += `&t=${Date.now()}`;

			console.log('API endpoint:', apiEndpoint);

			// Fetch games
			fetch(apiEndpoint)
				.then((response) => {
					if (!response.ok) {
						return response.json().then((err) => {
							throw new Error(err.message || 'Failed to load games');
						});
					}
					return response.json();
				})
				.then((games) => {
					if (!games || games.length === 0) {
						throw new Error('No games found or profile is private');
					}

					allGames = games;
					console.log(`Loaded ${games.length} games`);

					const filteredGames = games.filter((game) => game.playtime >= minHours);

					if (filteredGames.length === 0) {
						showStatusMessage(`No games found with ${minHours}+ hours of playtime`, 'error');
						loader.style.display = 'none';
						return;
					}

					gamePool.innerHTML = '';

					// Create game cards without achievements
					filteredGames.forEach((game) => {
						const gameCard = createGameCard(game);
						gamePool.appendChild(gameCard);
					});

					showStatusMessage(`Loaded ${filteredGames.length} games with ${minHours}+ hours (${games.length} total)`, 'success');
				})
				.catch((error) => {
					showStatusMessage(`Error: ${error.message}`, 'error');
					console.error('Error loading games:', error);
				})
				.finally(() => {
					loader.style.display = 'none';
				});
		}

			}

			};

			// Game name

			addTiltEffect(gameCard);

			// Set up drag events
			gameCard.addEventListener('dragstart', handleDragStart);
			gameCard.addEventListener('dragend', handleDragEnd);

			return gameCard;
		}

		// Improved tilt effect function with more pronounced effect
		function addTiltEffect(gameCard) {
			const tiltEffect = document.createElement('div');
			tiltEffect.className = 'tilt-effect';
			gameCard.appendChild(tiltEffect);

			// Add a subtle shadow to enhance the 3D effect
			gameCard.style.boxShadow = '0 6px 10px rgba(0, 0, 0, 0.15)';

			gameCard.addEventListener('mousemove', function (e) {
				const rect = this.getBoundingClientRect();
				const x = e.clientX - rect.left;
				const y = e.clientY - rect.top;

				const centerX = rect.width / 2;
				const centerY = rect.height / 2;

				const deltaX = (x - centerX) / centerX;
				const deltaY = (y - centerY) / centerY;

				// More pronounced tilt effect (increased multiplier from 7 to 15)
				// Added a subtle scale effect for better visual appeal
				this.style.transform = `perspective(500px) rotateX(${deltaY * -15}deg) rotateY(${deltaX * 15}deg) scale(1.1)`;

				// Enhanced shadow effect based on tilt direction
				const shadowX = deltaX * 10;
				const shadowY = deltaY * 10;
				const shadowBlur = 15;
				const shadowColor = 'rgba(0, 0, 0, 0.3)';
				this.style.boxShadow = `${shadowX}px ${shadowY}px ${shadowBlur}px ${shadowColor}`;

				// Longer transition on mousemove for smoother effect
				this.style.transition = 'transform 0.05s ease-out, box-shadow 0.05s ease-out';
			});

			gameCard.addEventListener('mouseleave', function () {
				// Reset the transform and shadow when mouse leaves
				// Add a 0.2s transition for a smoother reset
				this.style.transition = 'transform 0.2s ease-out, box-shadow 0.2s ease-out';
				this.style.transform = '';
				this.style.boxShadow = '0 6px 10px rgba(0, 0, 0, 0.15)';
			});

			// On mouse enter, set a faster transition time
			gameCard.addEventListener('mouseenter', function () {
				this.style.transition = 'transform 0.05s ease-out, box-shadow 0.05s ease-out';
			});
		}

		// Setup drag and drop
		function setupDragAndDrop() {
			// Set up drop zones
			const dropZones = document.querySelectorAll('.tier-items, #game-pool');
			dropZones.forEach((zone) => {
				zone.addEventListener('dragover', handleDragOver);
				zone.addEventListener('dragenter', handleDragEnter);
				zone.addEventListener('dragleave', handleDragLeave);
				zone.addEventListener('drop', handleDrop);
			});
		}

		// Drag and drop handlers
		function handleDragStart(e) {
			this.classList.add('dragging');
			e.dataTransfer.setData('text/plain', this.dataset.appid);
			e.dataTransfer.effectAllowed = 'move';

			// Create a custom drag image that shows the whole card
			const dragImage = this.cloneNode(true);
			dragImage.style.opacity = '1';
			dragImage.style.position = 'absolute';
			dragImage.style.top = '-1000px';
			document.body.appendChild(dragImage);
			e.dataTransfer.setDragImage(dragImage, 60, 60); // Center point

			// Clean up the clone after drag starts
			setTimeout(() => {
				document.body.removeChild(dragImage);
			}, 0);
		}

		function handleDragEnd() {
			this.classList.remove('dragging');
			document.querySelectorAll('.tier-items, #game-pool').forEach((item) => {
				item.classList.remove('drag-over');
			});
		}

		function handleDragOver(e) {
			e.preventDefault();
			e.dataTransfer.dropEffect = 'move';

			// For reordering within a tier
			const draggable = document.querySelector('.dragging');
			if (draggable && this.contains(draggable)) {
				const afterElement = getDragAfterElement(this, e.clientX, e.clientY);
				if (afterElement) {
					this.insertBefore(draggable, afterElement);
				} else {
					this.appendChild(draggable);
				}
			}

			return false;
		}

		// Function to determine position for reordering
		function getDragAfterElement(container, x, y) {
			// Get all non-dragging game cards in the container
			const draggableElements = [...container.querySelectorAll('.game-card:not(.dragging)')];

			// Find the closest element based on mouse position
			return draggableElements.reduce(
				(closest, child) => {
					// Get bounding rectangle for the element
					const box = child.getBoundingClientRect();

					// Calculate offset from the center (for horizontal sorting)
					const horizontalOffset = x - (box.left + box.width / 2);
					const verticalOffset = y - (box.top + box.height / 2);

					// Calculate distance from the mouse to the center of the element
					const distance = Math.sqrt(horizontalOffset * horizontalOffset + verticalOffset * verticalOffset);

					// Only consider elements that are "ahead" of the mouse
					// Only consider elements that are "ahead" of the mouse
					if (horizontalOffset > 0) return closest;

					// If this element is closer than the current closest, update closest
					if (distance < closest.distance) {
						return { element: child, distance: distance };
					} else {
						return closest;
					}
				},
				{ element: null, distance: Number.POSITIVE_INFINITY }
			).element;
		}

		function handleDragEnter(e) {
			this.classList.add('drag-over');
		}

		function handleDragLeave(e) {
			this.classList.remove('drag-over');
		}

		function handleDrop(e) {
			e.preventDefault();
			this.classList.remove('drag-over');

			const appId = e.dataTransfer.getData('text/plain');
			const draggedItem = document.querySelector(`.game-card[data-appid="${appId}"]`);

			if (draggedItem && !this.contains(draggedItem)) {
				// Get the element after which to insert the dragged item
				const afterElement = getDragAfterElement(this, e.clientX, e.clientY);

				if (afterElement) {
					this.insertBefore(draggedItem, afterElement);
				} else {
					this.appendChild(draggedItem);
				}
			}

			return false;
		}

		// Open edit tier modal
		function openEditTierModal() {
			console.log('Tier label clicked - opening edit modal');
			currentEditingTier = this;

			// Get current values
			const tierName = this.textContent;
			const tierColor = this.style.backgroundColor;

			console.log('Current tier values:', tierName, tierColor);

			// Set form values
			tierNameInput.value = tierName;

			// Set RGB values based on current color
			const rgb = hexToRgb(tierColor);
			if (rgb) {
				redInput.value = rgb.r;
				greenInput.value = rgb.g;
				blueInput.value = rgb.b;
				updateColorPreview();
			}

			// Show modal
			editTierModal.style.display = 'flex';
		}

		// Close edit tier modal
		function closeEditTierModal() {
			editTierModal.style.display = 'none';
		}

		// Save tier edit
		function saveTierEdit() {
			if (!currentEditingTier) return;

			// Update tier name
			const newName = tierNameInput.value.trim() || currentEditingTier.textContent;
			currentEditingTier.textContent = newName;

			// Adjust font size based on new name
			adjustTierLabelFontSize(currentEditingTier);

			// Update tier color
			if (selectedColor) {
				currentEditingTier.style.backgroundColor = selectedColor;

				// Update text color based on background brightness
				const rgb = hexToRgb(selectedColor);
				if (rgb) {
					const brightness = (rgb.r * 299 + rgb.g * 587 + rgb.b * 114) / 1000;
					currentEditingTier.style.color = brightness > 125 ? '#000' : '#fff';
				}
			}

			// Close modal
			closeEditTierModal();
		}

		// Add a new tier
		function addNewTier() {
			const tiers = ['D', 'E', 'F', 'G', 'H'];
			const colors = ['#7fff7f', '#7fffbf', '#7fbfff', '#bf7fff', '#ff7fbf'];

			const existingTiers = tierList.querySelectorAll('.tier').length;
			if (existingTiers >= 9) {
				showStatusMessage('Maximum number of tiers reached!', 'error');
				return;
			}

			const newTierIndex = existingTiers - 4; // We already have S, A, B, C
			if (newTierIndex >= 0 && newTierIndex < tiers.length) {
				const tier = document.createElement('div');
				tier.className = 'tier';

				// Create tier actions
				const tierActions = document.createElement('div');
				tierActions.className = 'tier-actions';

				const moveUpBtn = document.createElement('button');
				moveUpBtn.className = 'tier-action-btn move-up';
				moveUpBtn.title = 'Move Up';
				moveUpBtn.textContent = '↑';
				moveUpBtn.addEventListener('click', function () {
					const tier = this.closest('.tier');
					const prevTier = tier.previousElementSibling;

					if (prevTier) {
						tierList.insertBefore(tier, prevTier);
					}
				});

				const moveDownBtn = document.createElement('button');
				moveDownBtn.className = 'tier-action-btn move-down';
				moveDownBtn.title = 'Move Down';
				moveDownBtn.textContent = '↓';
				moveDownBtn.addEventListener('click', function () {
					const tier = this.closest('.tier');
					const nextTier = tier.nextElementSibling;

					if (nextTier) {
						tierList.insertBefore(nextTier, tier);
					}
				});

				const deleteBtn = document.createElement('button');
				deleteBtn.className = 'tier-action-btn delete';
				deleteBtn.title = 'Delete Tier';
				deleteBtn.textContent = '×';
				deleteBtn.addEventListener('click', function () {
					const tier = this.closest('.tier');
					const tierLabel = tier.querySelector('.tier-label').textContent;

					if (confirm(`Are you sure you want to delete the "${tierLabel}" tier? All games will be moved to the game pool.`)) {
						// Move all games to the game pool
						const games = tier.querySelectorAll('.game-card');
						games.forEach((game) => {
							gamePool.appendChild(game);
						});

						// Remove the tier
						tierList.removeChild(tier);

						showStatusMessage(`Deleted tier ${tierLabel}`, 'success');
					}
				});

				tierActions.appendChild(moveUpBtn);
				tierActions.appendChild(moveDownBtn);
				tierActions.appendChild(deleteBtn);

				const tierLabel = document.createElement('div');
				tierLabel.className = 'tier-label';
				tierLabel.textContent = tiers[newTierIndex];
				tierLabel.style.backgroundColor = colors[newTierIndex];

				// Add click handler for editing
				tierLabel.addEventListener('click', openEditTierModal);

				// Adjust font size for the new tier
				adjustTierLabelFontSize(tierLabel);

				const tierItems = document.createElement('div');
				tierItems.className = 'tier-items';
				tierItems.dataset.tier = tiers[newTierIndex];

				// Set up drop zone
				tierItems.addEventListener('dragover', handleDragOver);
				tierItems.addEventListener('dragenter', handleDragEnter);
				tierItems.addEventListener('dragleave', handleDragLeave);
				tierItems.addEventListener('drop', handleDrop);

				tier.appendChild(tierActions);
				tier.appendChild(tierLabel);
				tier.appendChild(tierItems);
				tierList.appendChild(tier);

				showStatusMessage(`Added tier ${tiers[newTierIndex]}`, 'success');
			}
		}

		// Reset tier list
		function resetTierList() {
			if (confirm('Are you sure you want to reset the tier list? All games will be moved back to the game pool.')) {
				const allGames = document.querySelectorAll('.tier-items .game-card');
				allGames.forEach((game) => {
					gamePool.appendChild(game);
				});
				showStatusMessage('Tier list has been reset', 'success');
			}
		}

		// Save tier list as image
		function saveTierListAsImage() {
			// Create a container with all tiers (including empty ones)
			const tempContainer = document.createElement('div');
			tempContainer.style.backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--bg-color');
			tempContainer.style.padding = '20px';

			const title = document.createElement('h1');
			title.textContent = 'Steam Library Tier List';
			title.style.color = getComputedStyle(document.documentElement).getPropertyValue('--accent-color');
			title.style.textAlign = 'center';
			tempContainer.appendChild(title);

			// Clone the tier list including all tiers
			const tierListClone = document.createElement('div');

			// Pre-load all images to cache them
			const gameImages = document.querySelectorAll('.game-image');
			const imagePromises = [];

			gameImages.forEach((img) => {
				const promise = new Promise((resolve) => {
					// If image is already loaded, resolve immediately
					if (img.complete) {
						resolve();
						return;
					}

					// Create a new image element to pre-load the same source
					const preloadImg = new Image();
					preloadImg.crossOrigin = 'anonymous';
					preloadImg.onload = () => resolve();
					preloadImg.onerror = () => resolve(); // Resolve on error too
					preloadImg.src = img.src;
				});

				imagePromises.push(promise);
			});

			// Show a loading message
			showStatusMessage('Preparing image...', 'normal');

			// Wait for all images to load
			Promise.all(imagePromises)
				.then(() => {
					// Clone all tiers regardless of whether they contain games
					document.querySelectorAll('.tier').forEach((tier) => {
						const tierClone = tier.cloneNode(true);

						// Remove tier actions for the export
						const tierActions = tierClone.querySelector('.tier-actions');
						if (tierActions) {
							tierClone.removeChild(tierActions);
						}

						// Hide steam store links
						tierClone.querySelectorAll('.steam-store-link').forEach((link) => {
							link.style.display = 'none';
						});

						// Remove tilt effects
						tierClone.querySelectorAll('.tilt-effect').forEach((effect) => {
							effect.remove();
						});

						// Apply export-specific styles to the clone
						tierClone.querySelectorAll('.game-card').forEach((card) => {
							card.classList.add('clone-for-export');
							// Ensure image is visible in the clone
							const img = card.querySelector('.game-image');
							if (img) {
								// If the original image didn't load, use the fallback
								if (img.naturalWidth === 0) {
									img.src =
										'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20version%3D%221.1%22%20width%3D%22120%22%20height%3D%2256%22%3E%3Crect%20width%3D%22120%22%20height%3D%2256%22%20fill%3D%22%23424242%22%2F%3E%3Ctext%20x%3D%2260%22%20y%3D%2228%22%20font-family%3D%22Arial%22%20font-size%3D%2212%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%23ffffff%22%3ENo%20Image%3C%2Ftext%3E%3C%2Fsvg%3E';
								}
							}
						});

						tierListClone.appendChild(tierClone);
					});

					tempContainer.appendChild(tierListClone);

					// Temporarily append to body but hide it
					tempContainer.style.position = 'absolute';
					tempContainer.style.left = '-9999px';
					document.body.appendChild(tempContainer);

					// Use html2canvas with proper settings
					return html2canvas(tempContainer, {
						backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg-color'),
						scale: 2,
						logging: true,
						useCORS: true, // Important for loading images from external domains
						allowTaint: true, // Allow using images from other domains
					});
				})
				.then((canvas) => {
					// Create download link
					const link = document.createElement('a');
					link.download = 'steam-tier-list.png';
					link.href = canvas.toDataURL('image/png');
					link.click();

					// Clean up
					document.body.removeChild(tempContainer);
					showStatusMessage('Tier list image saved!', 'success');
				})
				.catch((error) => {
					console.error('Error generating image:', error);
					showStatusMessage('Failed to generate image: ' + error.message, 'error');
					if (document.body.contains(tempContainer)) {
						document.body.removeChild(tempContainer);
					}
				});
		}

		// Show status message
		function showStatusMessage(message, type) {
			statusMessage.textContent = message;
			statusMessage.style.display = 'block';

			// Reset classes
			statusMessage.classList.remove('error', 'success');

			if (type === 'error') {
				statusMessage.classList.add('error');
			} else if (type === 'success') {
				statusMessage.classList.add('success');
			}

			// Auto hide after 5 seconds
			setTimeout(() => {
				statusMessage.style.display = 'none';
			}, 5000);
		}
	</script>
